# Supply chain policy, checked with `cargo deny check` locally and in CI.

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CDLA-Permissive-2.0",
]
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
# rustls is the only TLS stack (DECISIONS 060). OpenSSL and native TLS must never enter the
# tree, not even transitively, and aws-lc stays out because ring is the one crypto provider.
deny = [
  { name = "openssl" },
  { name = "openssl-sys" },
  { name = "native-tls" },
  { name = "aws-lc-rs" },
  { name = "aws-lc-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
