<a class="skip-link" href="#main">{{ 'shell.skipToContent' | transloco }}</a>
<header class="header">
  <a class="brand" routerLink="/">{{ 'app.name' | transloco }}</a>
  @if (me(); as user) {
    <div class="account">
      <span class="name">{{ user.displayName }}</span>
      <button type="button" class="signout" (click)="signOut()">
        {{ 'shell.signOut' | transloco }}
      </button>
    </div>
  }
</header>
<main id="main" class="main" tabindex="-1">
  <router-outlet />
</main>
