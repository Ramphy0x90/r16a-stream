name: r16a_stream
description: Private streaming client for r16a-stream.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cached_network_image: 4.0.7
  cupertino_ui: 1.1.7
  dio: 5.11.1
  flutter_appauth: 13.0.0
  flutter_riverpod: 3.5.0
  flutter_secure_storage: 11.2.0
  go_router: 18.1.4
  # Pinned by flutter_localizations of the SDK in use.
  intl: 0.20.3
  material_ui: 1.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  mocktail: 1.0.5
  swagger_parser: 2.1.1

flutter:
  uses-material-design: true
  generate: true
