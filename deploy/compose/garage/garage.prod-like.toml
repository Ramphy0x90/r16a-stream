# Garage for the prod-like compose stack. No secrets in this file, Garage 1.0.1 reads the RPC
# secret and both tokens from GARAGE_RPC_SECRET, GARAGE_ADMIN_TOKEN and GARAGE_METRICS_TOKEN,
# which compose fills from .env.

metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "lmdb"
replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.invalid"

[admin]
api_bind_addr = "[::]:3903"
