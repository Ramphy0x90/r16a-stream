# Local development building blocks. Infrastructure always runs in Docker, the apps run
# natively or from the profiles below.
#
#   docker compose -f docker-compose.dev.yml up -d                      Postgres 15, Garage, init
#   docker compose -f docker-compose.dev.yml --profile backend up -d    plus migrate and the API on 8081
#   docker compose -f docker-compose.dev.yml --profile worker up -d     plus the worker
#   docker compose -f docker-compose.dev.yml --profile web up -d        plus nginx on 8080
#
# Every credential in this file is a published dev-only value that works only against these
# local containers. All ports bind to 127.0.0.1. Postgres defaults to 5433 so it can run next to
# the Zaltys dev database on 5432. Ports can be overridden with the
# R16A_DEV_*_PORT variables, and an empty value asks Docker for a free port, which CI uses.
name: r16a-stream-dev

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

x-garage-keys: &garage-keys
  API_KEY_ID: GKe781357014cf1870ce72ffb3
  API_SECRET: 9be2320de5bf8e5b07297443f66bcb7ac546fee5bf2c3f91d7c070e385a43d99
  WORKER_KEY_ID: GKb21e6a01028af364e9ab7821
  WORKER_SECRET: 115f67a9ad320bb660d52232aad8eeb83be06e0f5ca9accae166c5572af89c69

x-app-env: &app-env
  R16A_ENV: development
  R16A_LOG_FORMAT: pretty
  RUST_LOG: info,sqlx=warn
  R16A_PUBLIC_URL: http://localhost:8080
  R16A_DEV_INSECURE_COOKIE: "true"
  R16A_S3_INTERNAL_ENDPOINTS: http://garage:3900
  R16A_S3_PUBLIC_ENDPOINT: http://localhost:8080
  R16A_S3_REGION: garage
  R16A_S3_MEDIA_BUCKET: r16a-stream-media
  R16A_S3_UPLOADS_BUCKET: r16a-stream-uploads

x-hardening: &hardening
  <<: *logging
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

services:
  db:
    <<: *logging
    image: postgres:15.20@sha256:2663a9f0fde52de94f5dad3603a1942359f49472f1017c1a6d64f66bfedacb40
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      R16A_OWNER_PASSWORD: dev-only-owner-password
      R16A_APP_PASSWORD: dev-only-app-password
      R16A_WORKER_PASSWORD: dev-only-worker-password
    ports:
      - "127.0.0.1:${R16A_DEV_DB_PORT-5433}:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
      - ./init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d r16a_stream"]
      interval: 2s
      timeout: 3s
      retries: 30

  garage:
    <<: *logging
    image: dxflrs/garage:v2.6.0@sha256:4b5a318fc9fe2fbec5d3af590eeafe05d83492e6411266fa0b9e215c20264013
    command: ["/garage", "-c", "/etc/garage.toml", "server"]
    ports:
      - "127.0.0.1:${R16A_DEV_S3_PORT-3900}:3900"
      - "127.0.0.1:${R16A_DEV_GARAGE_ADMIN_PORT-3903}:3903"
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage-meta-dev:/var/lib/garage/meta
      - garage-data-dev:/var/lib/garage/data

  garage-init:
    <<: *logging
    image: curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
    entrypoint: ["/bin/sh", "/init.sh"]
    environment:
      <<: *garage-keys
      GARAGE_ADMIN_TOKEN: dev-only-admin-f3700b0ac66d205e2ae37a7d4861a0277c9acf65a2ce5deb
    volumes:
      - ./garage/init.sh:/init.sh:ro
    depends_on:
      - garage
    restart: "no"

  migrate:
    <<: *hardening
    profiles: [backend]
    build:
      context: ../../backend
      target: api
    image: r16a-stream-backend:dev
    command: ["migrate"]
    environment:
      R16A_ENV: development
      R16A_MIGRATE_DATABASE_URL: postgres://r16a_stream_owner:dev-only-owner-password@db:5432/r16a_stream
    depends_on:
      db:
        condition: service_healthy

  backend:
    <<: *hardening
    profiles: [backend]
    image: r16a-stream-backend:dev
    environment:
      <<: *app-env
      R16A_HTTP_BIND: 0.0.0.0:8081
      R16A_DATABASE_URL: postgres://r16a_stream_app:dev-only-app-password@db:5432/r16a_stream
      R16A_S3_ACCESS_KEY_ID: GKe781357014cf1870ce72ffb3
      R16A_S3_SECRET_ACCESS_KEY: 9be2320de5bf8e5b07297443f66bcb7ac546fee5bf2c3f91d7c070e385a43d99
      R16A_GARAGE_METRICS_ENDPOINTS: http://garage:3903
      R16A_GARAGE_METRICS_TOKEN: dev-only-metrics-f74cb949c7b1a28ba6b29daef067730a5a8d04f9770eaa03
      # From the shell or a git-ignored deploy/compose/.env. Empty values make the API refuse to
      # start with the variable's name, the dev provider's secret is never committed.
      R16A_OIDC_ISSUER: ${R16A_OIDC_ISSUER:-}
      R16A_OIDC_WEB_CLIENT_ID: ${R16A_OIDC_WEB_CLIENT_ID:-r16a-stream-dev}
      R16A_OIDC_WEB_CLIENT_SECRET: ${R16A_OIDC_WEB_CLIENT_SECRET:-}
      R16A_OIDC_MOBILE_ISSUER: ${R16A_OIDC_MOBILE_ISSUER:-}
      R16A_OIDC_MOBILE_CLIENT_ID: ${R16A_OIDC_MOBILE_CLIENT_ID:-r16a-stream-mobile-dev}
      R16A_SESSION_KEY: BwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyAhIiMkJSY=
      R16A_TMDB_TOKEN: ${R16A_TMDB_TOKEN:-}
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      migrate:
        condition: service_completed_successfully
      garage-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/api", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    <<: *hardening
    profiles: [worker]
    build:
      context: ../../backend
      target: worker
    image: r16a-stream-worker:dev
    environment:
      <<: *app-env
      R16A_WORKER_HEALTH_BIND: 0.0.0.0:8082
      R16A_WORKER_DATABASE_URL: postgres://r16a_stream_worker:dev-only-worker-password@db:5432/r16a_stream
      R16A_WORKER_S3_ACCESS_KEY_ID: GKb21e6a01028af364e9ab7821
      R16A_WORKER_S3_SECRET_ACCESS_KEY: 115f67a9ad320bb660d52232aad8eeb83be06e0f5ca9accae166c5572af89c69
      R16A_WORKER_SCRATCH_DIR: /scratch
    ports:
      - "127.0.0.1:8082:8082"
    tmpfs:
      - /tmp
    volumes:
      - worker-scratch-dev:/scratch
    depends_on:
      db:
        condition: service_healthy
      garage-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/worker", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    <<: *hardening
    profiles: [web]
    build:
      context: ../..
      dockerfile: web/Dockerfile
    image: r16a-stream-web:dev
    # Host networking lets nginx reach an API and Garage on the host loopback, whether they run
    # natively or from the profiles above. It listens on 127.0.0.1 only.
    network_mode: host
    environment:
      R16A_WEB_LISTEN: 127.0.0.1:8080
      R16A_BACKEND_UPSTREAM: 127.0.0.1:8081
      R16A_GARAGE_UPSTREAM: 127.0.0.1:3900
    tmpfs:
      - /tmp
      - /etc/nginx/conf.d:uid=101,gid=101

volumes:
  pgdata-dev: {}
  garage-meta-dev: {}
  garage-data-dev: {}
  worker-scratch-dev: {}
